<style>
html,body{margin:0;height:100%;background:#1B201B;overflow:hidden}

<body>
<div id="sp"><img src="logo-full-white.png?v=2" alt="HST" style="width:200px;max-width:62vw"><span id="spt">LIVE YARD</span><span id="upd"></span><div id="snp"></div><i id="spi"></i><div id="spq"><q id="spqt"></q><small>H. Safieddine Transport · Lagos Workshop</small></div></div>

<script>

<script>
(function(){
  var ib=document.getElementById('ib'),hp=document.getElementById('hp'),dp=null;

  document.getElementById('hpc').onclick=function(){hp.style.display='none'};
  function show(){if(sa)return;ib.style.display='flex';window.__fit&&window.__fit()}
  function hide(){ib.style.display='none';window.__fit&&window.__fit()}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;show()});
  window.addEventListener('appinstalled',function(){sa=true;hide()});
  document.getElementById('ibx').onclick=hide;   // hidden for this visit only – shows again next time
  document.getElementById('ibi').onclick=function(){
    if(dp){dp.prompt();dp.userChoice.then(function(c){if(c&&c.outcome==='accepted')hide();dp=null});return}
    if(ios)window.__help('Install on iPhone','<ol><li>Open this page in <b>Safari</b></li><li>Tap the <b>Share</b> button (square with arrow)</li><li>Tap <b>Add to Home Screen</b> → <b>Add</b></li></ol>');

  };
  if(!sa)setTimeout(show,1500);
})();
</script>
<script type="module">
