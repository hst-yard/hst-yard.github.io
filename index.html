<style>
:root{--f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%;background:#1B201B;overflow:hidden}
#f{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:#F2F4F0}
@font-face{font-family:"HST Cond";font-weight:600;font-display:swap;src:url(f/bc600.woff2) format("woff2")}
@font-face{font-family:"HST Cond";font-weight:700;font-display:swap;src:url(f/bc700.woff2) format("woff2")}
@font-face{font-family:"HST CondFb";src:local("Roboto"),local("Arial"),local("Helvetica Neue");size-adjust:78%}
#sp{--c:"HST Cond","HST CondFb","Arial Narrow",var(--f);--p:clamp(18px,6.8vw,28px);--d:min(10.7vw,56px);--tk:13px;position:fixed;top:0;right:0;bottom:0;left:0;z-index:4;display:flex;justify-content:center;background:#fff;color:#1B201B;font:400 15px/1.4 var(--f);overflow:hidden;transition:opacity .35s}
#spw{position:relative;box-sizing:border-box;width:100%;max-width:520px;height:100%;padding:max(26px,calc(env(safe-area-inset-top,0px) + 14px)) var(--p) max(30px,calc(env(safe-area-inset-bottom,0px) + 24px));display:flex;flex-direction:column;transform-origin:50% 0}
#spl{flex:0 0 auto;display:flex;justify-content:space-between;align-items:stretch;gap:12px}
#spl img{display:block;width:min(204px,54vw);height:auto}
#spy{position:relative;flex:0 0 auto;display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding:1px 0 0 22px}
#spy:before{content:"";position:absolute;left:4px;top:2px;bottom:3px;width:1px;background:#D5DBD2;transform:skewX(-17deg)}
#spy b{display:block;font:700 56px/.74 var(--c);color:#1B201B;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#spy span{display:block;font:700 15px/1 var(--c);letter-spacing:.16em;color:#067327}
#spy small{display:block;margin-top:4px;font:400 13px/1 var(--f);letter-spacing:0;color:#3A443C}
#sph{position:relative;flex:0 0 auto;margin-top:16px;padding:calc(var(--d) + 20px) 0 calc(var(--d) + 22px);color:#fff}
#sphb{position:absolute;top:0;bottom:0;left:50%;width:100vw;margin-left:-50vw;background:#067327;-webkit-clip-path:polygon(0 var(--d),100% 0,100% calc(100% - var(--d)),0 100%);clip-path:polygon(0 var(--d),100% 0,100% calc(100% - var(--d)),0 100%);overflow:hidden}
#sphb i{position:absolute;top:-40px;bottom:-40px;left:84%;width:60vw;background:#05601F;opacity:.6;transform:skewX(-17deg)}
#shr{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
#spt{font:700 20px/1 var(--c);letter-spacing:.2em;white-space:nowrap}
#snpS{display:none;align-items:center;gap:7px;font:500 13px/1 var(--f);white-space:nowrap}
#snpS.on{display:flex}
@media(max-width:359px){#snpS{font-size:12px;gap:5px}}
#snpS i{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#9BE3A8}
#snpS.off i{background:#FFC864}
#sbg{position:relative;display:flex;align-items:flex-end;gap:16px;margin-top:16px}
#sbg:empty{display:none}
#sbg .n{flex:0 0 auto;margin-left:-4px;font:700 clamp(92px,32vw,132px)/.78 var(--c);letter-spacing:-2px;font-variant-numeric:tabular-nums}
#sbg .n sup{font-size:.44em;line-height:1;vertical-align:top;position:relative;top:.075em;margin-left:4px;letter-spacing:0}
#sbg .t{min-width:0;margin-bottom:-3px}
#sbg .t b{display:block;font:600 26px/1 var(--c)}
#sbg .t span{display:block;margin-top:9px;font:400 15px/1.2 var(--f)}
#sbg .t small{display:block;margin-top:6px;font:600 14.5px/1.25 var(--f)}
#sbg .t small u{text-decoration:none;display:table;margin:1px 0 5px;padding:3px 7px 2px;border-radius:3px;background:#FFE9C2;color:#7A4700;font:700 13px/1.2 var(--c);letter-spacing:.06em;text-transform:uppercase}
#sbg .t small u.r{background:#F9E3E0;color:#9B2A22}
#sbg .tx{font:600 24px/1.2 var(--c)}
#upd{position:relative;display:none;margin-top:16px;font:600 30px/1.15 var(--c)}
#sbg:not(:empty)~#upd{margin-top:12px;font:500 14px/1.2 var(--f)}
#snp{display:none;flex:0 0 auto;margin-top:2px}
#snp .fl{padding-top:16px}
#snp .fl+.fl{margin-top:16px;border-top:1px solid #D5DBD2}
#snp .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#snp .h>span{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
#snp .h b{font:600 26px/1 var(--c);min-width:0;overflow-wrap:anywhere}
#snp .h small{font:400 14px/1 var(--f);color:#3A443C;white-space:nowrap}#snp .h small+small{color:#5E6A62;font-size:13px}
#snp .h>div{flex:0 0 auto;display:flex;align-items:baseline;gap:9px}
#snp .h u{text-decoration:none;padding:3px 7px 2px;border-radius:3px;background:#FFE9C2;color:#7A4700;font:700 13px/1 var(--c);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;position:relative;top:-4px}
#snp .fl.r .h u{background:#F9E3E0;color:#9B2A22}
#snp .h em{flex:0 0 auto;font:700 30px/1 var(--c);font-style:normal;color:#067327;font-variant-numeric:tabular-nums}
#snp .fl.a .h em{color:#9A5F08}#snp .fl.r .h em{color:#C9302C}
#snp .tk{display:grid;grid-template-columns:repeat(var(--n,47),1fr);align-items:end;gap:4px 2.5px;margin:12px 2px 0}
#snp .tk i{height:var(--tk);transform:skewX(-17deg);background:#E3E8E0}
#snp .tk i.a,#snp .kv i.a{background:#067327}#snp .tk i.r,#snp .kv i.r{background:#4FA36A}#snp .tk i.d,#snp .kv i.d{background:#D9730B}#snp .tk i.x,#snp .kv i.x{background:#C9302C}
#snp .tk i.d,#snp .tk i.x{height:calc(var(--tk)*.6)}
#snp .mb{height:8px;margin:12px 0 0 2px;background:#E3E8E0;transform:skewX(-17deg);overflow:hidden}
#snp .mb i{display:block;height:100%;background:#2E9B57}#snp .fl.a .mb i{background:#E39B26}#snp .fl.r .mb i{background:#C9302C}
#snp .kv{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;margin-top:11px;font:400 13.5px/1.2 var(--f);color:#3A443C}
#snp .kv span{white-space:nowrap}
#snp .kv i{display:inline-block;width:6px;height:13px;margin:0 7px 0 2px;transform:skewX(-17deg);vertical-align:-1px}
#snp .kv i.d,#snp .kv i.x{height:8px}
#snp .kv b{font:600 19px/1 var(--c);color:#1B201B;margin-right:5px;font-variant-numeric:tabular-nums}

#snp .lg{margin-top:15px;padding-top:11px;border-top:1px solid #D5DBD2;font:400 13px/1.2 var(--f);color:#5E6A62}
#spq{margin-top:auto;padding-top:14px}
#sp:not(.sn) #spl{margin-top:auto}#sp:not(.sn) #sph{margin-bottom:6vh}
#spq q{display:block;font:500 15px/1.3 var(--f);color:#1B201B;quotes:"\201C" "\201D";text-wrap:balance}
#spc{display:block;margin-top:6px;font:400 12px/1.4 var(--f);color:#5E6A62}#spc span{white-space:nowrap}
#sp.s1 #spq q,#sp.s1 #snp .lg{display:none}
#sp.s2{--tk:8px}#sp.s2 #sph{margin-top:10px;padding:calc(var(--d) + 10px) 0 calc(var(--d) + 12px)}#sp.s2 #snp .fl{padding-top:10px}#sp.s2 #snp .fl+.fl{margin-top:10px}#sp.s2 #spl img{width:min(150px,44vw)}#sp.s2 #spy b{font-size:38px}#sp.s2 #snp .tk,#sp.s2 #snp .mb{margin-top:8px}#sp.s2 #snp .kv{margin-top:7px}
#sp.s3{--tk:6px;--d:22px}#sp.s3 #sbg .n{font-size:84px}#sp.s3 #snp .h small+small,#sp.s3 #spc span+span{display:none}#sp.s3 #snp .h b{font-size:22px}#sp.s3 #snp .h em{font-size:25px}
#sp.s4 #snp .tk{display:none}#sp.s4 #snp .kv{margin-top:5px}
#spi{position:absolute;left:var(--p);right:var(--p);bottom:max(11px,calc(env(safe-area-inset-bottom,0px) + 7px));height:3px;border-radius:2px;background:#E3E8E0;overflow:hidden}
#spi i{display:block;width:38%;height:100%;background:#067327;animation:ld 1.3s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(265%)}}
@media(max-width:359px){#spy b{font-size:46px}#spy span{font-size:13.5px}#snp .h u{display:none}#sbg{gap:12px}#sbg .t b{font-size:22px}#snp .tk{gap:4px 2px}#snp .kv{gap:2px 12px}}
@media(max-height:850px){#sp{--tk:11px}#sph{margin-top:12px;padding:calc(var(--d) + 14px) 0 calc(var(--d) + 16px)}#snp .fl{padding-top:13px}#snp .fl+.fl{margin-top:13px}#snp .lg{margin-top:12px;padding-top:9px}}
@media(max-height:770px){#sp{--tk:9px;--d:min(8vw,40px)}#spw{padding-top:max(18px,calc(env(safe-area-inset-top,0px) + 10px))}#spl img{width:min(170px,48vw)}#spy b{font-size:44px}#sbg .n{font-size:clamp(84px,27vw,108px)}#spq q{display:none}#spq{padding-top:10px}}
@media(max-height:660px){#sp{--tk:8px}#snp .lg{display:none}#spl img{width:min(150px,44vw)}#spy b{font-size:38px}#spy span{font-size:13px}#sbg .n{font-size:clamp(72px,23vw,92px)}#sbg .t b{font-size:22px}#snp .h b{font-size:22px}#snp .h em{font-size:25px}#snp .tk,#snp .mb{margin-top:9px}#snp .kv{margin-top:8px}}
@media(min-width:700px) and (min-height:900px){#spw{max-width:600px}#sp{--tk:15px;--p:32px}#spl img{width:240px}#spy b{font-size:66px}#spy span{font-size:17px}#sbg .n{font-size:156px}#sbg .t b{font-size:30px}#snp .h b{font-size:30px}#snp .h em{font-size:34px}}
@media(min-aspect-ratio:5/4) and (max-height:899px){
#sp.sn #spw{max-width:1120px;padding-bottom:max(54px,calc(env(safe-area-inset-bottom,0px) + 46px));display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);grid-template-rows:auto auto;column-gap:clamp(40px,7vw,96px);align-content:center}
#sp.sn #spl{grid-column:1;grid-row:1}#sp.sn #sph{grid-column:1;grid-row:2}
#sp.sn #spq{position:absolute;left:var(--p);right:var(--p);bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 18px));margin:0;padding:0}#sp.sn #spq q{display:none}
#sp.sn #snp{grid-column:2;grid-row:1/3;align-self:center;margin-top:0}
#sp.sn #sphb{left:auto;right:-36px;margin-left:0;-webkit-clip-path:polygon(0 var(--d),100% 0,calc(100% - 58px) calc(100% - var(--d)),0 100%);clip-path:polygon(0 var(--d),100% 0,calc(100% - 58px) calc(100% - var(--d)),0 100%)}
#sp.sn{--d:34px}#sp.sn #sphb i{left:auto;right:-60px;width:170px}
#sp.sn #snp .fl:first-child{padding-top:0}}
@media(min-aspect-ratio:5/4) and (min-height:640px) and (max-height:899px){#sp.sn{--tk:14px}#sp.sn #spl img{width:232px}#sp.sn #spy b{font-size:62px}#sp.sn #sbg .n{font-size:140px}#sp.sn #sph{margin-top:22px;padding:calc(var(--d) + 26px) 0 calc(var(--d) + 30px)}#sp.sn #snp .fl+.fl{margin-top:22px}#sp.sn #snp .fl{padding-top:22px}}
@media(min-aspect-ratio:5/4) and (max-height:520px){#sp{--tk:7px}#sp.sn{--d:22px}#spw{padding-top:12px}#sp.sn #spw{grid-template-columns:minmax(0,300px) minmax(0,1fr);column-gap:44px;padding-bottom:40px}#sp.sn #spq{bottom:19px}#spl img{width:120px}#spy b{font-size:30px}#spy span{font-size:12px}#spy small{display:none}#sph{margin-top:6px;padding:calc(var(--d) + 8px) 0 calc(var(--d) + 10px)}#spt{font-size:15px}#sbg{margin-top:8px;gap:10px}#sbg .n{font-size:64px}#sbg .t b{font-size:18px}#sbg .t span{font-size:13px;margin-top:3px}#sbg .t small{margin-top:2px;font-size:12.5px}#spq q,#snp .lg{display:none}#spc{font-size:11px;margin-top:0}#spc span+span{display:none}#snp .h b{font-size:19px}#snp .h em{font-size:22px}#snp .fl+.fl{margin-top:9px}#snp .fl{padding-top:9px}#snp .tk,#snp .mb{margin-top:7px}#snp .kv{margin-top:6px;font-size:12.5px}#snp .kv b{font-size:16px}}
@media(prefers-reduced-motion:reduce){#spi i{animation:none;width:100%;opacity:.35}}
#nb{display:none;position:fixed;left:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;background:#067327;color:#fff;border:0;border-radius:22px;padding:10px 16px;font:600 14px var(--f);box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:pointer}
#off{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#E0661F;color:#fff;padding:9px 14px;border-radius:10px;font:600 14px var(--f);z-index:5}
#ib{display:none;position:fixed;top:0;left:0;right:0;z-index:7;background:#067327;color:#fff;font:600 14px var(--f);padding:8px 10px;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#ib img{width:30px;height:30px;border-radius:7px;background:#fff}
#ib span{flex:1;line-height:1.25}#ib small{display:block;font-weight:400;font-size:12px;opacity:.9}
#ib button{border:0;border-radius:16px;padding:7px 13px;font:700 13px var(--f);cursor:pointer}
#ibi{background:#fff;color:#067327}#ibx{background:transparent;color:#fff;font-size:18px!important;padding:4px 8px!important}
#hp{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
#hp div{background:#fff;color:#1B201B;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 18px 22px;font:14px/1.5 var(--f)}
#hp b.t{display:block;font-size:16px;margin-bottom:6px;color:#067327}#hp ol{margin:6px 0 12px;padding-left:20px}
#hp button{width:100%;border:0;border-radius:10px;padding:11px;background:#067327;color:#fff;font:700 14px var(--f)}
body.spOn #nb,body.spOn #off{display:none!important}#sp.nq #spq{display:none}
</style>
